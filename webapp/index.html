<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      Local mode has no public/_headers, so this tag mirrors that policy.
      connect-src adds the local data server and the two model APIs that the
      browser calls directly in local mode. On Cloudflare Pages the stricter
      header policy also applies. vite.config.ts relaxes script-src and
      connect-src for `vite dev` only (React Refresh preamble and HMR).
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob: https://*.twimg.com; connect-src 'self' http://localhost:8765 http://127.0.0.1:8765 https://api.deepseek.com https://api.voyageai.com; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#4a90ff" />
    <title>Trove</title>
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon-180.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
  </head>
  <body class="antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
