name: CI

on:
  push:
  pull_request:

# Read-only token. No job needs to write to the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  webapp:
    name: Web app (typecheck, unit tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webapp
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: webapp/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  python:
    name: Python unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v

  scripts:
    name: Launcher, extension, and data checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Extension unit tests
        run: node x-collector/test/units.mjs
      - name: Launcher syntax
        run: bash -n trove
      - name: Launcher keeps secrets out of argv
        run: bash tests/test_trove_secrets.sh
      - name: No real data check self-test
        run: bash tests/test_check_no_real_data.sh
      - name: No real data in tracked files
        run: bash scripts/check-no-real-data.sh
